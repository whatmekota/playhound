apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/**
 * The release key, never in the repo: from the environment
 *   PH_KEYSTORE, PH_KEYSTORE_PASSWORD, PH_KEY_ALIAS, PH_KEY_PASSWORD
 * or from a keystore.properties outside it, named by PH_KEYSTORE_PROPERTIES
 * (android/run.mjs points it at <toolchain>\keys\keystore.properties):
 *   storeFile=playhound-release.jks   (relative to the properties file)
 *   storePassword=…
 *   keyAlias=playhound
 *   keyPassword=…
 * The environment wins over the file. Null when neither names a keystore.
 */
def releaseSigning() {
    def env = System.getenv()
    def props = new Properties()
    def propsFile = env.PH_KEYSTORE_PROPERTIES ? file(env.PH_KEYSTORE_PROPERTIES) : null
    if (propsFile != null && propsFile.isFile()) propsFile.withInputStream { props.load(it) }
    def pick = { String envName, String key -> env[envName] ?: props.getProperty(key) }
    def store = pick('PH_KEYSTORE', 'storeFile')
    if (!store) return null
    def storeFile = new File(store)
    if (!storeFile.isAbsolute() && propsFile != null && !env.PH_KEYSTORE) storeFile = new File(propsFile.parentFile, store)
    if (!storeFile.isFile()) throw new GradleException("The release keystore is not there: ${storeFile}")
    return [
        storeFile: storeFile,
        storePassword: pick('PH_KEYSTORE_PASSWORD', 'storePassword'),
        keyAlias: pick('PH_KEY_ALIAS', 'keyAlias') ?: 'playhound',
        keyPassword: pick('PH_KEY_PASSWORD', 'keyPassword') ?: pick('PH_KEYSTORE_PASSWORD', 'storePassword'),
    ]
}
def releaseKey = releaseSigning()

android {
    namespace = "io.github.whatmekota.playhound"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.whatmekota.playhound"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Follows package.json's version (see versionFromPackage below).
        versionCode versionFromPackage().code
        versionName versionFromPackage().name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKey != null) {
            release {
                storeFile releaseKey.storeFile
                storePassword releaseKey.storePassword
                keyAlias releaseKey.keyAlias
                keyPassword releaseKey.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned without a key (see releaseSigning below); run.mjs refuses to ship that.
            if (releaseKey != null) signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

/**
 * The app's version from package.json, so the APK says the same as the
 * desktop app: "2.2.0" → versionName 2.2.0, versionCode 2_002_000.
 */
def versionFromPackage() {
    def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
    def parts = (pkg.version as String).tokenize('.-')
    def n = { int i -> parts.size() > i && parts[i].isInteger() ? parts[i] as int : 0 }
    return [name: pkg.version as String, code: n(0) * 1_000_000 + n(1) * 1_000 + n(2)]
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // android.jar's org.json is a stub in JVM tests; the net routes' tests need the real one.
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
