<!doctype html>
<html lang="en" class="h-full" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>playhound</title>
    <meta name="description" content="Audiovisual session engine and funscript player with TCode/OSR device support" />
  </head>
  <body class="h-full bg-surface-950 text-white overflow-hidden">
    <div id="app" class="h-full"></div>
    <noscript>
      <div>Please enable JavaScript to use this application.</div>
    </noscript>
    <script>
      // Apply the persisted theme before first paint to avoid a flash
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
