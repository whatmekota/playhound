shellEmulator: true

trustPolicy: no-downgrade
# Pulled in by electron-builder. 5.7.2 and 6.3.1 are the 2023 ReDoS
# backports, published by hand after 7.x had moved to provenance, which is what
# trips the check — not a takeover. Pinned exactly so nothing else slips past.
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'

packages: []
catalog:
  megajs: ^1.3.10
  undici: ^7.30.1
  ws: ^8.21.3
catalogs:
  build:
    '@iconify-json/carbon': ^1.2.19
    '@vitejs/plugin-vue': ^6.0.4
    jsdom: ^28.1.0
    unocss: ^66.6.2
    unplugin: ^3.0.0
    unplugin-auto-import: ^21.0.0
    unplugin-vue-components: ^31.0.0
    vite: ^7.3.1
  desktop:
    '@resvg/resvg-js': ^2.6.2
    '@xhayper/discord-rpc': ^1.5.1
    electron: ^44.9.3
    electron-builder: ^26.17.0
  dev:
    '@antfu/eslint-config': ^7.6.1
    '@types/node': ^25.3.3
    '@types/three': ^0.184.1
    '@types/w3c-web-serial': ^1.0.8
    '@unocss/eslint-plugin': ^66.6.3
    '@vue/test-utils': ^2.4.6
    eslint: ^10.0.2
    eslint-plugin-format: ^2.0.1
    lint-staged: ^16.3.1
    simple-git-hooks: ^2.13.1
    taze: ^19.9.2
    typescript: ^5.9.3
    vitest: ^4.0.18
    vue-tsc: ^3.2.5
  frontend:
    '@vueuse/core': ^14.2.1
    buttplug: ^5.0.2
    hls.js: 1.7.3
    osr-emu: ^0.7.0
    pinia: ^3.0.3
    three: ^0.184.0
    vue: ^3.5.29
    vue-router: ^5.0.3
ignoredBuiltDependencies:
  # Squirrel.Windows support in electron-builder; the app ships as NSIS / portable.
  - electron-winstaller
onlyBuiltDependencies:
  - electron
  - esbuild
  - simple-git-hooks
  - unrs-resolver
